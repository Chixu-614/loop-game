<!DOCTYPE html>
<html lang="zh-CN">
<head>

body{margin:0;background:#1a1020;color:#c8b8d8;display:flex;align-items:center;justify-content:center;height:100vh;font-family:system-ui,sans-serif;}
.box{text-align:center;}

</div>
